name: Test(native-cmake)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'test/**.cpp'
      - 'test/**.hpp'
      - 'test/**.h'
      - '.github/workflows/native-cmake-check.yml'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'test/**.cpp'
      - 'test/**.hpp'
      - 'test/**.h'
      - '.github/workflows/native-cmake-check.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # platformio-build-check.yml runs the same tests on GCC and Clang, but
  # PlatformIO's native platform hardcodes env.Tool("gcc"), so MSVC can only be
  # reached by driving CMake directly. Templates are the reason this runs the
  # tests rather than only compiling: src/*.cpp instantiates none of them, so a
  # compile-only check would leave BitSegment, the endian types, the circular
  # buffer and the optional/expected polyfills unchecked on MSVC.
  #
  # MSVC has no /std:c++11, so this job is C++14. The C++11 floor stays with the
  # PlatformIO host tests.
  native-cmake:
    name: Native:CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: M5Utility

      - name: Generate the check project
        run: |
          mkdir -p native_check
          cat > native_check/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(m5utility_native_cmake CXX)

          set(CMAKE_CXX_STANDARD 14)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          include(FetchContent)
          FetchContent_Declare(
            googletest
            GIT_REPOSITORY https://github.com/google/googletest.git
            GIT_TAG release-1.12.1
          )
          # Match the CRT of the rest of the build on MSVC
          set(gtest_force_shared_crt ON CACHE BOOL "" FORCE)
          FetchContent_MakeAvailable(googletest)

          file(GLOB_RECURSE m5utility_sources "${M5UTILITY_DIR}/src/*.cpp")
          # Not GLOB_RECURSE: test/optional and test/expected are #included by
          # their aggregating .cpp, and test/native and test/embedded belong to
          # PlatformIO
          file(GLOB test_sources "${M5UTILITY_DIR}/test/*.cpp")

          add_executable(m5utility_native_cmake ${test_sources} ${m5utility_sources})
          target_include_directories(m5utility_native_cmake
            PRIVATE "${M5UTILITY_DIR}/src" "${M5UTILITY_DIR}/test")
          # common_main.cpp provides main(), so link gtest rather than gtest_main,
          # and ask it to report the real exit code
          target_compile_definitions(m5utility_native_cmake PRIVATE M5_UTILITY_TEST_RETURN_RESULT)
          target_link_libraries(m5utility_native_cmake PRIVATE gtest)

          enable_testing()
          add_test(NAME m5utility COMMAND m5utility_native_cmake)
          EOF

      - name: Configure
        run: |
          cmake -S native_check -B native_check/build \
            -DM5UTILITY_DIR="${{ github.workspace }}/M5Utility"

      - name: Build
        run: |
          cmake --build native_check/build --config Release

      - name: Test
        run: |
          ctest --test-dir native_check/build -C Release --output-on-failure
